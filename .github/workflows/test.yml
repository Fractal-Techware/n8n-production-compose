name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Pre-pull the pinned images
        run: |
          for i in n8nio/n8n:2.39.7 n8nio/runners:2.39.7 postgres:17.11-alpine caddy:2.11.4; do
            docker pull -q "$i"
          done

      - name: shellcheck, script tests, compose checks, end-to-end stack test
        run: ./run-tests.sh
