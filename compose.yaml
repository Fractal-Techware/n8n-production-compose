# FTW n8n Production Compose (free edition) — hardened single instance
# n8n 2.39.7 + external task runner + PostgreSQL 17 + Caddy (automatic HTTPS)
#
#   ./scripts/init-secrets.sh          # creates .env with generated secrets (never overwrites)
#   $EDITOR .env                        # set N8N_DOMAIN, N8N_PUBLIC_URL, CADDY_TLS
#   ./scripts/check-config.sh           # catches the usual mistakes before you start
#   docker compose up -d
#
# Only Caddy publishes ports. n8n, the task runner and PostgreSQL sit on an internal network
# with no route to the host. Every image is pinned to an exact tag.

name: ${COMPOSE_PROJECT_NAME:-n8n}

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    <<: *hardening
    image: postgres:17.11-alpine
    user: "70:70"
    read_only: true
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-secrets.sh}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=0775
      - /tmp:uid=70,gid=70
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1g}

  n8n:
    <<: *hardening
    image: n8nio/n8n:2.39.7
    user: "1000:1000"
    read_only: true
    environment:
      # --- database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-secrets.sh}
      DB_POSTGRESDB_POOL_SIZE: ${DB_POSTGRESDB_POOL_SIZE:-4}
      # --- identity & URLs (behind Caddy, one proxy hop)
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run scripts/init-secrets.sh}
      N8N_HOST: ${N8N_DOMAIN:?set N8N_DOMAIN in .env}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      N8N_WEBHOOK_URL: ${N8N_PUBLIC_URL:?set N8N_PUBLIC_URL in .env}
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL}
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}
      # --- privacy & hardening
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_PUBLIC_API_DISABLED: ${N8N_PUBLIC_API_DISABLED:-false}
      N8N_COMMUNITY_PACKAGES_ENABLED: ${N8N_COMMUNITY_PACKAGES_ENABLED:-true}
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      # Set explicitly: upstream will lower both defaults in a future version.
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
      # --- executions: bounded runtime and automatic pruning
      EXECUTIONS_TIMEOUT: ${EXECUTIONS_TIMEOUT:-3600}
      EXECUTIONS_TIMEOUT_MAX: ${EXECUTIONS_TIMEOUT_MAX:-7200}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-50000}
      N8N_CONCURRENCY_PRODUCTION_LIMIT: ${N8N_CONCURRENCY_PRODUCTION_LIMIT:-20}
      N8N_GRACEFUL_SHUTDOWN_TIMEOUT: ${N8N_GRACEFUL_SHUTDOWN_TIMEOUT:-30}
      # --- external task runner (the Code node runs in the n8n-runner container, not in n8n)
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?run scripts/init-secrets.sh}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_TASK_TIMEOUT: ${N8N_RUNNERS_TASK_TIMEOUT:-300}
      # --- logs
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_LOG_OUTPUT: console
      N8N_LOG_FORMAT: ${N8N_LOG_FORMAT:-text}
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/home/node/.n8n-files
    tmpfs:
      # read-only root filesystem: n8n needs a writable /tmp and a static-asset cache
      - /tmp:uid=1000,gid=1000
      - /home/node/.cache:uid=1000,gid=1000
    networks: [backend, edge]
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz/readiness >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2g}

  n8n-runner:
    <<: *hardening
    image: n8nio/runners:2.39.7
    user: "1000:1000"
    read_only: true
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?run scripts/init-secrets.sh}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: ${N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT:-15}
      N8N_RUNNERS_MAX_CONCURRENCY: ${N8N_RUNNERS_MAX_CONCURRENCY:-5}
      N8N_RUNNERS_TASK_TIMEOUT: ${N8N_RUNNERS_TASK_TIMEOUT:-300}
      N8N_RUNNERS_LAUNCHER_LOG_LEVEL: ${N8N_RUNNERS_LAUNCHER_LOG_LEVEL:-info}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
    tmpfs:
      - /tmp:uid=1000,gid=1000
      - /home/runner:uid=1000,gid=1000
    networks: [backend]
    depends_on:
      n8n:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5680/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1g}

  caddy-init:
    # One-shot: make Caddy's volumes writable for the non-root Caddy process.
    image: caddy:2.11.4
    user: "0:0"
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    # Non-recursive on purpose: the volume roots are created by Docker as root, everything
    # inside them is created by Caddy itself as uid 1000.
    entrypoint: ["/bin/sh", "-c", "chown 1000:1000 /data /config"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    network_mode: none

  caddy:
    <<: *hardening
    image: caddy:2.11.4
    user: "1000:1000"
    read_only: true
    cap_add:
      - NET_BIND_SERVICE
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN:?set N8N_DOMAIN in .env}
      CADDY_TLS: ${CADDY_TLS:?set CADDY_TLS in .env (your ACME email, or internal)}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:uid=1000,gid=1000
    networks: [edge]
    depends_on:
      caddy-init:
        condition: service_completed_successfully
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256m}

networks:
  edge: {}
  backend:
    internal: true

volumes:
  postgres_data: {}
  n8n_data: {}
  caddy_data: {}
  caddy_config: {}
  n8n_files: {}
